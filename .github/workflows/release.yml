name: Release

# Create a GitHub release whenever the integration's manifest version changes.
on:
  push:
    branches: [main]
    paths:
      - custom_components/abrp/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: version
        run: |
          version="$(jq -r .version custom_components/abrp/manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # Release notes: this version's CHANGELOG.md section (from its
          # "## <version>" heading to the next "## "), followed by GitHub's
          # generated "Full Changelog" compare link.
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "${{ github.sha }}"
